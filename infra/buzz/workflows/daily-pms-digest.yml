# 정비 만기 일일 다이제스트
#
# 매일 아침 YJT 백엔드에서 PMS 만기 도래 목록을 가져와 채널에 게시합니다.
#
# 주의사항 3가지
#  1) cron 은 UTC 기준입니다. 아래 "0 23 * * *" = 한국시간 08:00.
#  2) call_webhook 대상은 반드시 공인 주소여야 합니다. 릴레이가 SSRF 방지를 위해
#     사설/예약 IP 로 해석되는 호스트를 차단합니다(사내 IP·localhost 불가).
#     YJT 백엔드가 Render 등 공개 도메인에 있으면 그대로 사용 가능합니다.
#  3) call_webhook 이 포함된 워크플로는 채널 owner/admin 권한으로만 저장·실행됩니다.
#     (채널 내용을 외부로 내보낼 수 있는 액션이라 일반 멤버 권한으로는 막혀 있음)
#
# 백엔드는 사람이 읽을 수 있는 텍스트를 그대로 응답 본문으로 돌려주면 됩니다.
# 응답은 {{steps.fetch_due.output.body}} 로, 상태코드는 정수로 평가됩니다.
name: 정비 만기 일일 다이제스트
description: 매일 08:00(KST)에 만기 도래 정비 항목을 채널에 게시합니다.
trigger:
  on: schedule
  cron: "0 23 * * *"
steps:
  - id: fetch_due
    name: YJT 백엔드에서 만기 목록 조회
    timeout_secs: 30
    action: call_webhook
    url: https://YOUR-BACKEND-DOMAIN/api/maintenance/due-digest
    method: GET
    headers:
      X-Api-Key: REPLACE_WITH_BACKEND_TOKEN

  - id: post_digest
    name: 다이제스트 게시
    if: steps_fetch_due_output_status == 200
    action: send_message
    text: |
      🛠 **오늘의 정비 만기 항목**

      {{steps.fetch_due.output.body}}

  - id: post_failure
    name: 조회 실패 알림
    if: steps_fetch_due_output_status != 200
    action: send_message
    text: |
      ⚠️ 정비 만기 목록 조회에 실패했습니다 (HTTP {{steps.fetch_due.output.status}}).
      백엔드 상태를 확인해 주세요.
